# /etc/nginx/sites-available/staticphp.sh
#
# StaticPHP prebuilt binary redirect API. The PHP front controller is public/index.php;
# /fetch.sh and /fetch.ps1 are plain static files served from the same directory.
# TLS is added by `certbot --nginx -d staticphp.sh`, which rewrites this file.

server {
    listen 80;
    listen [::]:80;
    server_name staticphp.sh;

    root /var/www/staticphp.sh/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Single-file endpoint: everything that is not a real file goes to index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm-staticphp.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 30s;
    }

    # Client scripts: cache briefly, but keep them text/plain so browsers show the source.
    location = /fetch.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location = /fetch.ps1 {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    # Health check for uptime monitoring.
    location = /health {
        access_log off;
        try_files /index.php =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/staticphp.sh/access.log;
    error_log  /var/log/nginx/staticphp.sh/error.log;
}
