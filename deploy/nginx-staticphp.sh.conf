# /etc/nginx/conf.d/staticphp.sh.conf
#
# Follows the conventions of the other vhosts on this server: one file per domain in conf.d/,
# per-domain access/error logs, php8.4-fpm on /var/run/php/php8.4-fpm.sock and the stock
# snippets/fastcgi-php.conf include (same as phpmirror.static-php.dev).
#
# The API is a real file (/fetch.php) and the usage page is static (index.html), so no front
# controller or try_files rewriting is needed; only /fetch.php can reach PHP at all.
#
# Install this as plain HTTP first, then:
#   sudo certbot --nginx -d staticphp.sh
# certbot rewrites the file to add the listen 443 server and the 80 -> 443 redirect, exactly like
# the dl.static-php.dev and phpmirror.static-php.dev vhosts.

server {
    server_name staticphp.sh;

    root /var/www/staticphp.sh/public;
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    access_log /var/log/nginx/staticphp.sh/access.log;
    error_log  /var/log/nginx/staticphp.sh/error.log;

    # The only executable entry point. GET and HEAD only; OPTIONS is allowed for CORS preflight.
    location = /fetch.php {
        limit_except GET OPTIONS { deny all; }
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    # Client scripts: plain files, text/plain, cached briefly.
    location ~ ^/fetch\.(?:sh|ps1)$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    # Uptime probe: a static "ok" file, no PHP involved, no log noise.
    location = /health {
        access_log off;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen 80;
}
