; /etc/php/8.2/fpm/pool.d/staticphp-sh.conf
;
; Dedicated pool for the staticphp.sh service: it only needs PHP + curl, and the metadata
; cache directory must be writable by this pool's user.

[staticphp-sh]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-staticphp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Keep the worker environment clean, then add exactly what the service reads.
clear_env = yes
env[PHP_BIN_BASE] = https://dl.static-php.dev/v3/php-bin
env[PHP_BIN_CACHE_DIR] = /var/cache/staticphp-sh
env[PHP_BIN_CACHE_TTL] = 300

php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php/staticphp-sh-error.log
php_admin_value[expose_php] = Off
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 30
