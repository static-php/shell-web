; Append these lines to the [www] section of /etc/php/8.4/fpm/pool.d/www.conf.
;
; This server runs a single php8.4-fpm pool (php-mirror.static-php.dev uses the same socket), and
; php-fpm clears the environment by default (clear_env = yes), so the service can only read the
; variables declared here. Everything else keeps its defaults.

env[PHP_BIN_BASE] = https://dl.static-php.dev/v3/php-bin
env[PHP_BIN_CACHE_DIR] = /var/cache/staticphp-sh
env[PHP_BIN_CACHE_TTL] = 300
